name: Build Assistant APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK components
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              ANDROID_HOME=/usr/local/lib/android/sdk
            elif [ -d "$HOME/Android/Sdk" ]; then
              ANDROID_HOME="$HOME/Android/Sdk"
            else
              echo "Android SDK not found on runner" >&2
              exit 1
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Build nonRoot debug APK
        run: ./gradlew assembleNonRootDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-assistant-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
